[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskqueue"
version = "0.1.0"
description = "Cost-aware fraud detection and analyst review prioritization"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35",
  "fastapi>=0.115",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "prefect>=3.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "snowflake-connector-python>=3.12",
  "sqlalchemy>=2.0",
  "streamlit>=1.39",
  "uvicorn[standard]>=0.31",
  "xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["riskqueue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
